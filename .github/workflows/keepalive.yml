name: Ping guandan-system (Beijing 14:00-22:00 window)

# 2026-08-26：silicon-guandan-system 已升级 Render Starter($7/月)付费实例，24/7 常驻，
# 不再需要对它做保活 ping。本 workflow 只管**老系统 guandan-system**(Python/Flask，
# 独立 Render 免费实例，guandan-system.onrender.com)。
#
# 2026-08-27 改为按需时段 ping(用户要求)：不追求 24/7，只需覆盖**北京时间 14:00–22:00**
# (用户当前实际使用时段)，这 8 小时内每 10 分钟 ping 一次，让它在这段时间基本保持"热"、
# 减少冷启动等待；时段外任其自然休眠，无所谓。
#
# ⚠️ 之前版本用 `curl -f`(失败即报错)导致老系统正常的冷启动/瞬时抖动也被当成
#    workflow 失败，狂发"workflow run failed"邮件——纯噪音。这版**故意不用 -f**，
#    失败只在日志里记一行，不让 job 报红、不发邮件。
#
# ⚠️ GitHub Actions 的 schedule 本身不保证准时/不丢跑，仅供粗粒度参考。
# ⚠️ 仓库 60 天无提交，GitHub 会自动停用 schedule —— 若长期不动，需到 Actions 页手动重新启用。
#
# 🕐 以后回美国要调整时段，只改下面 cron 的小时数：GitHub Actions cron 用 UTC，
#    北京时间 = UTC+8（无夏令时）；美国太平洋时间 = UTC-7(夏令时PDT)或UTC-8(冬令时PST)。
#    换算：目标本地时段的「小时-8(北京)」或「小时+7/+8(太平洋)」就是该填的 UTC 小时。
#    北京 14:00-22:00 → UTC 06:00-14:00 → 当前 cron 小时段 6-13。

on:
  schedule:
    - cron: '*/10 6-13 * * *'   # 北京时间 14:00–22:00（UTC 06:00–14:00），每10分钟一次
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping guandan-system (soft, never fails the job)
        run: |
          BASE="https://guandan-system.onrender.com"
          echo "Pinging $BASE/ ..."
          curl -sS --max-time 90 "$BASE/" -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            || echo "ping had an issue (cold start / transient) — not failing the job"
