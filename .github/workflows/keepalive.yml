name: Monitor guandan-system (low frequency)

# 2026-08-26：silicon-guandan-system 已升级 Render Starter($7/月)付费实例，
# 24/7 常驻不休眠，不再受免费层 15 分钟无请求休眠 / 750 实例小时共享额度限制，
# 因此不再需要对它做高频保活 ping。
#
# 本 workflow 改为低频监控**老系统 guandan-system**(Python/Flask，独立 Render
# 免费实例，guandan-system.onrender.com)：不追求让它 24/7 不休眠(它按需冷启动
# 是预期行为，冷启动约 30~50 秒)，只是每 30 分钟探测一次它是否还能正常响应，
# 真正宕机(而非单纯休眠冷启动)时能在 Actions 页看到失败记录/收到 GitHub 通知。
#
# ⚠️ GitHub Actions 的 schedule 定时任务本身不保证准时/不丢跑(已实测：配置 5 分钟
#    间隔实际观测到 40~80 分钟的执行间隔)，仅适合当粗粒度健康检查，不适合当作
#    强依赖的保活机制。
# ⚠️ 仓库 60 天无提交，GitHub 会自动停用 schedule —— 若长期不动，需到 Actions 页手动重新启用。

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping guandan-system (old system health check)
        run: |
          BASE="https://guandan-system.onrender.com"
          echo "Pinging $BASE/ ..."
          # 冷启动可能要 ~50s，给足超时；这里不吞失败——真宕机要在 Actions 页显示红叉。
          curl -fsS --max-time 90 "$BASE/" -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"
